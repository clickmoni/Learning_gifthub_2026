<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create ClickMoni Account</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0f172a;
color:#fff;
padding:25px;

}

.container{

max-width:500px;
margin:auto;

}

.logo{

text-align:center;
font-size:34px;
font-weight:bold;
color:#ef4444;
margin-top:20px;

}

.subtitle{

text-align:center;
margin:12px 0 30px;
color:#cbd5e1;

}

.form{

background:#1e293b;
padding:25px;
border-radius:15px;

}

.group{

margin-bottom:18px;

}

label{

display:block;
margin-bottom:7px;
font-size:14px;
color:#cbd5e1;

}

input{

width:100%;
padding:15px;
border:none;
outline:none;
background:#0f172a;
border:1px solid #334155;
border-radius:10px;
color:#fff;
font-size:15px;

}

input:focus{

border-color:#ef4444;

}

button{

width:100%;
padding:16px;
background:#ef4444;
color:white;
font-size:17px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;

}

button:hover{

background:#dc2626;

}

.footer{

text-align:center;
margin-top:20px;

}

.footer a{

color:#ef4444;
text-decoration:none;

}

</style>
</head>

<body>

<div class="container">

<div class="logo">
💰 ClickMoni
</div>

<p class="subtitle">
Create your ClickMoni account
</p>

<div class="form">
    <form id="signupForm">

<div class="group">
<label>First Name</label>
<input
type="text"
id="firstName"
required>
</div>

<div class="group">
<label>Last Name</label>
<input
type="text"
id="lastName"
required>
</div>

<div class="group">
<label>Username</label>
<input
type="text"
id="username"
required>
</div>

<div class="group">
<label>Email Address</label>
<input
type="email"
id="email"
required>
</div>

<div class="group">
<label>Phone Number</label>
<input
type="text"
id="phone"
required>
</div>

<div class="group">
<label>Referral Code (Optional)</label>
<input
type="text"
id="affiliate">
</div>

<div class="group">
<label>Password</label>
<input
type="password"
id="password"
required>
</div>

<button
type="submit"
id="registerBtn">
Create Account
</button>

</form>

<div class="footer">

Already have an account?

<br><br>

<a href="login.html">
Login Here
</a>

</div>

</div>

    </div>
    <script>

window.onload = function () {

    const params = new URLSearchParams(window.location.search);

    const ref = params.get("ref");

    if (ref && ref !== "null" && ref !== "undefined") {

        document.getElementById("affiliate").value = ref;

    }

};

document.getElementById("registerForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const btn = document.getElementById("signupBtn");

    btn.disabled = true;

    btn.textContent = "Creating Account...";

    const data = {

        firstName: document.getElementById("firstName").value.trim(),

        lastName: document.getElementById("lastName").value.trim(),

        username: document.getElementById("username").value.trim(),

        email: document.getElementById("email").value.trim(),

        phone: document.getElementById("phone").value.trim(),

        password: document.getElementById("password").value,

        affiliate: document.getElementById("affiliate").value.trim()

    };

    try{

        const response = await fetch(
            "https://learning-gifthub-2026.pages.dev/api/register",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(data)
            }
        );

        const result = await response.json();

        if(result.success){

            localStorage.setItem("currentUser", data.email);

            localStorage.setItem("clickmoni_email", data.email);

            alert("Account created successfully!");

            window.location.href = "dashboard.html";

        }else{

            btn.disabled = false;

            btn.textContent = "Create Account";

            alert(result.message);

        }

    }catch(err){

        console.error(err);

        btn.disabled = false;

        btn.textContent = "Create Account";

        alert("Unable to connect to the server.");

    }

});

</script>

</body>
    </html>
